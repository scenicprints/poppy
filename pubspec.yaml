name: poppy
description: "Poppy — California trip planner. 443 places, season windows, ready-made trips."
publish_to: "none"
version: 0.2.1+5

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  package_info_plus: ^8.0.0
  open_filex: ^4.4.0
  path_provider: ^2.1.3
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  intl: ^0.19.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#2E5339"
  adaptive_icon_foreground: assets/icon/icon_fg.png

flutter:
  uses-material-design: true
  assets:
    - assets/seed.json
